[package]
name = "noto"
version = "1.1.0"
description = "Suite documentaire locale Noto : lire, éditer et traiter vos fichiers"
authors = ["Louxos Corporation", "Noto contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
