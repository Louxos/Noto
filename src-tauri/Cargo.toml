[package]
name = "noto"
version = "1.2.1"
description = "Suite documentaire locale Noto : lire, éditer et traiter vos fichiers"
authors = ["Louxos Corporation", "Noto contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy", "zip"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
